name: Bug
description: Report something that is not working as expected.
title: "[BUG] "
labels:
  - bug

body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please provide enough context for us to understand and reproduce it.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is happening?
      placeholder: Describe the problem clearly and concisely.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should happen instead?
      placeholder: Describe the expected behavior.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can the issue be reproduced?
      placeholder: |
        1. Go to...
        2. Click on...
        3. Enter...
        4. See the error...
    validations:
      required: false

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Where did the issue occur?
      placeholder: Local / Development / Production / Browser / Device
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots, logs or any other useful information.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I checked that a similar issue does not already exist.
          required: true
        - label: I removed any sensitive information from logs or screenshots.
          required: true
