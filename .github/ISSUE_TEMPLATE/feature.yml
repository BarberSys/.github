name: Feature
description: Suggest a new feature or improvement.
title: "[FEATURE] "
labels:
  - feature

body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first, then the proposed solution. Features should solve a real user, business or engineering need.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are we trying to solve?
      placeholder: Describe the current problem, limitation or opportunity.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What should we build or change?
      placeholder: Describe the proposed approach.
    validations:
      required: true

  - type: textarea
    id: value
    attributes:
      label: Expected value
      description: Why is this useful?
      placeholder: Explain the expected value for users, the business or the platform.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is included or explicitly not included?
      placeholder: |
        In scope:
        -

        Out of scope:
        -
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add mockups, examples, links, technical notes or related issues.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I checked that a similar issue does not already exist.
          required: true
